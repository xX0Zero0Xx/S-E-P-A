version: '3.8'

networks:
  sepa_network:
    driver: bridge

volumes:
  db_data:

services:
  # Contenedor de Base de Datos (Oculto al exterior)
  db:
    image: postgres:15-alpine # O mysql:8.0 según tu motor
    container_name: sepa_db
    restart: always
    environment:
      POSTGRES_DB: sepa_db
      POSTGRES_USER: sepa_user
      POSTGRES_PASSWORD: sepa_password_seguro
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - sepa_network
    # NOTA: No declaramos 'ports', la DB solo es accesible dentro de 'sepa_network'

  # Contenedor Apache2 + PHP (Servicio Web)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sepa_web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db # Se conecta usando el nombre del servicio
      DB_PORT: 5432
      DB_DATABASE: sepa_db
      DB_USERNAME: sepa_user
      DB_PASSWORD: sepa_password_seguro
    depends_on:
      - db
    networks:
      - sepa_network